# NIPS — Network Intrusion Prevention System Configuration

engine:
  # Kitsune anomaly detector
  kitsune:
    max_autoencoder_size: 10
    fm_grace_period: 5000       # feature mapping learning period (packets)
    ad_grace_period: 50000      # anomaly detection training period (packets)
    learning_rate: 0.1
    threshold_percentile: 99.0  # RMSE percentile for anomaly threshold

  # LUCID DDoS detector.  model_path empty = LUCID not deployed (the
  # detector is not registered).  Point it at a trained .h5 to enable.
  lucid:
    time_window: 10.0           # flow time window (seconds)
    packets_per_flow: 10        # packets per flow sample
    model_path: ""              # path to trained Keras model; "" disables LUCID

  # Rule engine
  rule_engine:
    rate_limit:
      window_seconds: 1.0
      # A "connection" is a new session attempt: a TCP SYN (ACK clear) or a
      # UDP datagram.  Packets of an established TCP session (ACK/data/FIN)
      # do not consume the budget, so a bulk transfer cannot rate-limit its
      # own legitimate peer.
      max_connections_per_window: 100
    allowed_protocols: [6, 17]  # TCP, UDP
    # ICMP types that pass even though protocol 1 is not in allowed_protocols.
    # Blocking the whole protocol also breaks Path MTU Discovery (type 3), which
    # blackholes large connections.  Only consulted for packets that actually
    # reach the pipeline — see interception.intercept_icmp.
    # e.g. [0, 3, 4, 8, 11, 12] = echo reply, dest-unreach, source-quench,
    #                          echo, time-exceeded, parameter-problem
    # ICMPv6 link maintenance (types 2, 133, 134, 135, 136) passes regardless:
    # queuing neighbour discovery and then blocking it takes this host off the
    # network instead of defending it.
    allowed_icmp_types: []

interception:
  nfqueue_num: 0
  # Redirect ICMP into NFQUEUE so the per-type policy above can act on it.
  # Off by default: without it ICMP simply bypasses the IPS (it is not blocked
  # by it), and turning it on makes ping/PMTUD wait on userspace verdicts.
  intercept_icmp: false
  safe_ips:                     # never-block IPs
    - "127.0.0.1"
    - "::1"

# BLOCK-verdict escalation policy.  A single ML BLOCK no longer installs a
# permanent kernel DROP: strikes accumulate per source IP inside a rolling
# window; crossing the threshold triggers a temp ban (kernel DROP + rule-
# engine blacklist with a TTL, auto-lifted); repeated ban/recur cycles
# escalate to permanent (persisted blacklist).
blocking:
  strikes_threshold: 5          # BLOCKs inside strikes_window before a temp ban
  strikes_window: 300.0         # seconds; rolling window, old strikes fall off
  temp_ban_seconds: 600.0       # temp-ban TTL
  temp_ban_count_to_perm: 3     # completed temp bans before permanent escalation
  table_max: 50000              # LRU cap on tracked escalation records

api:
  host: "0.0.0.0"
  port: 8000
  title: "NIPS — Network Intrusion Prevention System"
  # Management-API authentication.  Empty = auth DISABLED (development only;
  # the server logs a WARNING).  Every /api/v1/* call must then carry
  # header 'X-API-Token: <token>'.  NIPS_API_TOKEN env var overrides this.
  auth_token: ""
  # Browser origins allowed to call the API (CORS).  "*" was removed: the
  # API can blacklist/whitelist arbitrary IPs, so any origin must be
  # explicit.
  cors_origins:
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"

logging:
  level: "INFO"                 # DEBUG, INFO, WARNING, ERROR
  # Rotating log file. "" keeps console output only. Relative paths resolve
  # against the repository root, so a systemd WorkingDirectory cannot move them.
  file: ""                      # e.g. "logs/nips.log"
  max_bytes: 10485760           # rotate at 10 MiB
  backups: 5                    # keep 5 rotated files
  # Forward to syslog. "" picks the platform socket when one exists
  # (/dev/log on Linux, /var/run/syslog on macOS); "host:port" sends UDP.
  syslog_address: ""

# Durable management-plane storage: detection alerts and the audit trail of
# every rule/engine change. SQLite (WAL); the detection path only enqueues, so
# a slow or broken disk cannot stall packet handling.
storage:
  events_db: "data/events.db"
  max_rows: 200000              # hard cap per table, oldest rows pruned first
  retention_days: 30            # rows older than this are purged
  queue_size: 10000             # in-memory buffer; events are dropped (and counted) when full
