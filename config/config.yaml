# NIPS — Network Intrusion Prevention System Configuration

engine:
  # Kitsune anomaly detector
  kitsune:
    max_autoencoder_size: 10
    fm_grace_period: 5000       # feature mapping learning period (packets)
    ad_grace_period: 50000      # anomaly detection training period (packets)
    learning_rate: 0.1
    threshold_percentile: 99.0  # RMSE percentile for anomaly threshold

  # LUCID DDoS detector
  lucid:
    time_window: 10.0           # flow time window (seconds)
    packets_per_flow: 10        # packets per flow sample

  # Rule engine
  rule_engine:
    rate_limit:
      window_seconds: 1.0
      max_connections_per_window: 100
    allowed_protocols: [6, 17]  # TCP, UDP

interception:
  nfqueue_num: 0
  safe_ips:                     # never-block IPs
    - "127.0.0.1"
    - "::1"

api:
  host: "0.0.0.0"
  port: 8000
  title: "NIPS — Network Intrusion Prevention System"

logging:
  level: "INFO"                 # DEBUG, INFO, WARNING, ERROR
