<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIPS — Network Intrusion Prevention System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0d1117; color: #c9d1d9; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; padding: 2rem; }
  h1 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 1.5rem; }
  .status-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px;
               padding: 1rem 1.25rem; min-width: 140px; }
  .stat-card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
  .stat-card .value { font-size: 1.5rem; font-weight: 600; color: #f0f6fc; }
  .stat-card .value.blocked { color: #f85149; }
  .stat-card .value.allowed { color: #3fb950; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-size: 0.8rem; font-weight: 500; }
  td { font-size: 0.875rem; }
  .refresh { color: #8b949e; font-size: 0.75rem; margin-bottom: 1rem; }
  a { color: #58a6ff; }
  .indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               margin-right: 0.5rem; }
  .indicator.on { background: #3fb950; }
  .indicator.off { background: #f85149; }
</style>
</head>
<body>
<div class="container">
  <h1>NIPS — Network Intrusion Prevention System</h1>

  <div class="status-bar" id="stats">
    <div class="stat-card">
      <div class="label">Status</div>
      <div class="value"><span class="indicator on" id="status-dot"></span><span id="status-text">--</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Processed</div>
      <div class="value" id="total-processed">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Blocked</div>
      <div class="value blocked" id="total-blocked">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Uptime</div>
      <div class="value" id="uptime">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Kitsune</div>
      <div class="value" id="kitsune-ready">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Detection Loop</div>
      <div class="value" id="detect-stale">--</div>
    </div>
  </div>

  <p class="refresh">Auto-refresh every 5s | API docs: <a href="/docs">/docs</a></p>

  <h2 style="font-size:1.1rem;margin-bottom:0.5rem;color:#f0f6fc">Recent Alerts</h2>
  <table>
    <thead><tr><th>Time</th><th>Source IP</th><th>Detector</th><th>Reason</th></tr></thead>
    <tbody id="alerts-body"></tbody>
  </table>
</div>

<script>
async function refresh() {
  try {
    const [status, alerts] = await Promise.all([
      fetch('/api/v1/status').then(r => r.json()),
      fetch('/api/v1/alerts?limit=20').then(r => r.json())
    ]);

    document.getElementById('total-processed').textContent = status.total_processed;
    document.getElementById('total-blocked').textContent = status.total_blocked;
    document.getElementById('uptime').textContent = Math.floor(status.uptime_seconds) + 's';
    document.getElementById('kitsune-ready').textContent = status.kitsune_trained ? 'Ready' : 'Learning';

    const dot = document.getElementById('status-dot');
    const st = document.getElementById('status-text');
    dot.className = 'indicator ' + (status.running ? 'on' : 'off');
    st.textContent = status.running ? 'Running' : 'Stopped';

    // Detection-loop health: null = interception never started; large
    // staleness while interception is active means the loop is hung and
    // traffic is being fail-closed dropped.
    const staleEl = document.getElementById('detect-stale');
    const stale = status.detection_loop_stale_seconds;
    if (stale === null || stale === undefined) {
      staleEl.textContent = 'n/a';
    } else if (stale > 10) {
      staleEl.textContent = Math.floor(stale) + 's STALE';
      staleEl.style.color = '#f85149';
    } else {
      staleEl.textContent = Math.floor(stale) + 's ago';
      staleEl.style.color = '';
    }

    const tbody = document.getElementById('alerts-body');
    tbody.replaceChildren(...(alerts.items || []).map(a => {
      const tr = document.createElement('tr');
      const tdTime = document.createElement('td'); tdTime.textContent = a.timestamp;
      const tdIp = document.createElement('td'); tdIp.textContent = a.source_ip;
      const tdDet = document.createElement('td'); tdDet.textContent = a.detector;
      const tdReason = document.createElement('td'); tdReason.textContent = a.reason;
      tr.append(tdTime, tdIp, tdDet, tdReason);
      return tr;
    }));
  } catch(e) { console.error(e); }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
