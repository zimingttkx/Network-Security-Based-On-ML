name: CI

# dev 是日常主干，main 只在发布时接收 dev→main 的 PR；两个分支都走 PR、都受
# 同样的保护。dev 必须列在触发分支里：否则往 dev 合的 PR 会要求一个根本不会
# 运行的 ci/required，分支直接被锁死。
# 分支保护只需要钉 `ci/required` 一个检查名：增删 job、改 job 名都不用再动
# 保护规则，也不会有"某个必需检查被改名后保护静默失效"这种事。
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.9"
  BANDIT_VERSION: "1.9.4"

jobs:
  # ── 改动范围：只有真能碰到代码的变更才拉起下游 ──────────────────────
  # 自己用 git diff 判，不引第三方 paths-filter——为一行判断引入一个外部 ref
  # 不划算。改 CI 自身算"能碰到代码"，所以 workflow 文件的变化一律全跑。
  triage:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      suites: ${{ steps.filter.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what has to run
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CODE_RE='^(networksecurity/|scripts/|config/|deploy/|app\.py$|cli\.py$|setup\.py$|requirements[^/]*\.txt$|Dockerfile$|docker-compose\.yml$|[^/]+\.sh$)'

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "非 PR 触发，全部 job 照跑" >> "$GITHUB_STEP_SUMMARY"
          elif git diff --name-only "$BASE" "$HEAD" | grep -qE '\.github/workflows/(ci|nightly)\.yml$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "改动包含 workflow 自身，全部 job 照跑" >> "$GITHUB_STEP_SUMMARY"
          elif git diff --name-only "$BASE" "$HEAD" | grep -qE "$CODE_RE"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            {
              echo "文档/注释类改动，重 job 跳过："
              git diff --name-only "$BASE" "$HEAD" | sed 's/^/- `/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 单元矩阵从仓库里枚举，不手抄一遍脚本名：手抄的清单要么漏掉新加的
          # 套件，要么像连字符那样抄错一个字符，然后整批 job 空转。
          suites=$(for f in scripts/verify_*.py; do
            s=$(basename "$f" .py); s=${s#verify_}
            case "$s" in
              # 这两个要 root + netns，各有专门 job；那个要练三个种子、半小时
              # 起步，属 nightly。真值那一半已拆到 capture_truth，跟矩阵走。
              live_nfqueue|kernel_rules|real_capture_quality) continue ;;
            esac
            printf '"%s",' "$s"
          done | sed 's/,$//')
          echo "suites=[$suites]" >> "$GITHUB_OUTPUT"
          echo "单元矩阵套件：$(echo "$suites" | tr -d '"')" >> "$GITHUB_STEP_SUMMARY"

  # ── workflow 文件自身的语法与引用检查 ───────────────────────────────
  # 门禁流水线坏了 = 整个项目没有门禁，所以这一条必须独立且永远在跑。
  # 镜像按 digest 钉：这里挂的是"检查别人之前先检查自己"的位置。
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 不用 container job：那个镜像里的默认用户对 runner 挂在 /__w/_temp 的
      # 工作目录没有写权限，actions/checkout 光保存 state 就 EACCES 了。
      # 直接 docker run 只读挂载，同样能钉 digest。
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/check:ro" -w /check \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color .github/workflows/*.yml

  # ── 快层：语法、禁词、以及"只按 requirements.txt 装能不能起来" ──────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install tools
        run: pip install "ruff==$RUFF_VERSION"

      - name: Ruff — syntax & undefined names
        run: |
          ruff check networksecurity/ app.py cli.py scripts/ \
            --select=E9,F63,F7,F82 \
            --output-format=full

      # 这条以前是 --exit-zero，也就是永远不会红。要恢复阻塞就得先把
      # 现存违规清零 —— 见 CONTRIBUTING.md 的「What CI Runs」。
      - name: Ruff — strict subset report
        continue-on-error: true
        run: |
          mkdir -p reports
          ruff check networksecurity/ app.py cli.py \
            --select=F,E,W,I,N,UP,B,SIM,PL,RET,PERF \
            --ignore=E501,S101,S311,S104,DTZ005,BLE001,RUF012,RUF013,EXE001,F841,W293,W291,PLR2004,N803,PLC0415,E741,N806,B904,PLR0913,PLR0917,PLW0603,RET504,PERF203,PERF401,SIM105 \
            --output-format=concise | tee reports/ruff-style.txt || true
          echo "现存风格违规 $(wc -l < reports/ruff-style.txt) 条（尚不阻塞）" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit — report at every severity
        continue-on-error: true
        run: |
          pip install "bandit==$BANDIT_VERSION"
          mkdir -p reports
          # 以前只报 -ll（MEDIUM+），而本项目的命中全在 LOW，于是那条门禁
          # 永远不可能红。这里先出全级别报告，收口口径留到后续 PR。
          bandit -r networksecurity/ app.py cli.py scripts/ \
            --skip B101,B303,B311,B104,B310 -f txt -o reports/bandit.txt || true
          tail -25 reports/bandit.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit — MEDIUM and above blocks
        run: |
          bandit -r networksecurity/ app.py cli.py \
            --skip B101,B303,B311,B104,B310 -f screen -ll

      - name: No simulation code in production modules
        run: |
          [ -d networksecurity ] || { echo "::error::networksecurity/ missing"; exit 1; }
          files=$(find networksecurity/ -name '*.py' -type f | wc -l)
          [ "$files" -gt 0 ] || { echo "::error::no Python files under networksecurity/"; exit 1; }
          echo "扫描 $files 个文件"
          # -w 是词边界：以前 "fake" 这种子串会连注释和 docstring 一起误报。
          if hits=$(grep -rnwE 'mock|simulate|fake|demo_data|generate_packet|test_traffic' \
                       networksecurity/ --include='*.py'); then
            echo "::error::仿真代码出现在生产模块里"
            echo "$hits"
            exit 1
          fi

      # 只装 requirements.txt 的那个环境，才是交付物真正运行的环境。
      # 以前 CI 手写依赖清单，于是"某个 import 只在 CI 里满足"这种事
      # 一路绿灯到过镜像里（parquet 引擎就是这个缺口暴露出来的）。
      - name: Runtime-only environment imports everything
        run: |
          python -m venv .venv-runtime
          .venv-runtime/bin/pip install -q --upgrade pip
          .venv-runtime/bin/pip install -q -r requirements.txt
          .venv-runtime/bin/python - <<'PY'
          import importlib.util
          import importlib, pkgutil, sys
          import networksecurity

          failed = []
          for mod in pkgutil.walk_packages(networksecurity.__path__, "networksecurity."):
              if "lucid.cnn" in mod.name and importlib.util.find_spec("tensorflow") is None:
                  continue          # 可选重型依赖，缺省时按设计不注册
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          if failed:
              print("\n".join(f"::error::{f}" for f in failed))
              sys.exit(1)
          print("requirements.txt 单独装出来的环境可导入全部生产模块")
          PY

      - name: Packaging must not fail silently
        run: |
          # 旧写法是 pip install -e . --no-deps 2>/dev/null || true ——
          # setup.py 写坏了也照样绿。
          pip install -e . --no-deps
          python -c "import importlib.metadata as m; print('nips', m.version('nips'))"

  # ── 模块回归：一个脚本一个 job ─────────────────────────────────────
  # 以前 8 个脚本在同一个 job 里串行，一个失败后面全看不到；拆开之后
  # 一次 PR 就能拿到全部脚本的独立结论。
  unit:
    name: unit / ${{ matrix.suite }}
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.triage.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ${{ matrix.suite }}
        # 非 root 是前提之一：verify_management_plane 断言"engine/start 必须
        # 拒绝非 root"，以 root 跑会翻出一次假红。GitHub 的 runner 本来就是
        # 普通用户，这里把它写成显式检查，免得以后换 runner 时静默失真。
        run: |
          set -o pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::这一层必须以非 root 运行，见 verify_management_plane 的 engine/start 断言"
            exit 1
          fi
          mkdir -p .ci-logs
          python scripts/verify_${{ matrix.suite }}.py 2>&1 | tee ".ci-logs/${{ matrix.suite }}.log"

      - name: Show skipped assertions
        if: always()
        run: |
          log=.ci-logs/${{ matrix.suite }}.log
          [ -f "$log" ] || exit 0
          if grep -q '\[SKIP\]\|^SKIP' "$log"; then
            {
              echo "### ${{ matrix.suite }} 跳过项"
              grep '\[SKIP\]\|^SKIP' "$log" | sed 's/^/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.suite }}
          path: .ci-logs/
          retention-days: 14

  # ── 引擎内联单测 ───────────────────────────────────────────────────
  # 这三段历史更早、直接写在 workflow 里，搬成 scripts/ 下的文件属于另一件事。
  units-inline:
    name: Unit tests (inline)
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pipeline lifecycle
        run: |
          python -c "
          import asyncio
          from networksecurity.engine import DetectionPipeline, PacketInfo, Action
          from networksecurity.engine.kitsune.detector_adapter import KitsuneDetector

          async def test():
              p = DetectionPipeline()
              p.add_detector(KitsuneDetector())

              # lifecycle
              assert p.running == False
              p.start()
              assert p.running == True

              # blacklist
              p.rule_engine.add_blacklist('10.0.0.99')
              v = await p.process_packet(PacketInfo(
                  '10.0.0.99', '192.168.1.1', 1234, 80, 6, 100, 0.0))
              assert v.action == Action.BLOCK

              # whitelist
              p.rule_engine.add_whitelist('10.0.0.50')
              v2 = await p.process_packet(PacketInfo(
                  '10.0.0.50', '192.168.1.1', 1234, 80, 6, 100, 0.0))
              assert v2.action == Action.ALLOW

              # protocol filter
              v3 = await p.process_packet(PacketInfo(
                  '192.168.1.5', '192.168.1.1', 0, 0, 1, 64, 0.0))
              assert v3.action == Action.BLOCK

              # counters
              assert p.total_processed == 3
              assert p.total_blocked == 2

              p.stop()
              assert p.running == False
              print(f'Pipeline test OK: {p.total_processed}pkt/{p.total_blocked}blocked')

          asyncio.run(test())
          "

      - name: Packet parser (TTL + TCP options)
        run: |
          python -c "
          import struct, socket
          from networksecurity.interception.packet_parser import PacketParser

          def ip_header(total_len):
              ip = bytearray(20)
              ip[0] = 0x45; struct.pack_into('!H', ip, 2, total_len)
              ip[8] = 128; ip[9] = 6  # TTL=128, TCP
              ip[12:16] = socket.inet_aton('10.0.0.1')
              ip[16:20] = socket.inet_aton('10.0.0.2')
              return bytes(ip)

          tcp = bytearray(20)
          tcp[12] = 0x50  # data offset = 5
          struct.pack_into('!H', tcp, 0, 12345)
          struct.pack_into('!H', tcp, 2, 80)
          tcp[13] = 0x02
          pkt = PacketParser.from_raw(ip_header(40) + bytes(tcp))
          assert pkt and pkt.ttl == 128 and pkt.src_port == 12345
          print(f'Parser test OK: TTL={pkt.ttl} sport={pkt.src_port}')

          # TCP with options: total_len has to cover the longer header, or the
          # frame contradicts itself and the fail-closed parser rejects it.
          tcp2 = bytearray(32)
          tcp2[12] = 0x80  # data offset = 8 (32 bytes)
          struct.pack_into('!H', tcp2, 0, 54321)
          struct.pack_into('!H', tcp2, 2, 443)
          tcp2[13] = 0x18
          pkt2 = PacketParser.from_raw(ip_header(52) + bytes(tcp2))
          assert pkt2 and pkt2.src_port == 54321 and pkt2.tcp_flags == 0x18
          assert pkt2.payload_size == 0 and pkt2.packet_size == 52
          print(f'TCP options OK: sport={pkt2.src_port} flags={pkt2.tcp_flags:#x}')

          # The same frame with a lying total_len must be rejected outright.
          assert PacketParser.from_raw(ip_header(40) + bytes(tcp2)) is None
          print('Inconsistent total_len rejected OK')
          "

      - name: RuleEngine persistence
        run: |
          python -c "
          import tempfile, os, json
          from pathlib import Path
          from networksecurity.engine.rule_engine import RuleEngine

          re = RuleEngine()
          re.add_blacklist('10.0.0.1')
          re.add_whitelist('192.168.1.0/24')

          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
              tmp = f.name
          re.save_rules(Path(tmp))

          re2 = RuleEngine()
          re2.load_rules(Path(tmp))
          os.unlink(tmp)

          assert '10.0.0.1' in re2.get_blacklist()
          assert '192.168.1.0/24' in re2.get_whitelist()
          print('Persistence test OK')
          "

  # ── 内核规则实测（真 netfilter）───────────────────────────────────
  # 其余测试验的是我们自己的记账；这一 job 验真正决定丢包的东西。
  # 独立 netns：netfilter 规则按 netns 隔离，runner 自身网络不受影响。
  kernel-rules:
    name: Kernel rules (Linux, netns)
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create isolated network namespace
        run: sudo ip netns add nips-verify

      - name: Verify real iptables behaviour
        run: |
          set -o pipefail
          sudo ip netns exec nips-verify python scripts/verify_kernel_rules.py \
            2>&1 | tee kernel-rules.log

      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rules
          path: kernel-rules.log
          retention-days: 14

      - name: Remove namespace
        if: always()
        run: sudo ip netns del nips-verify || true

  # ── 实时拦截闭环（netns + NFQUEUE + 真流量）───────────────────────
  # kernel-rules 止步于"规则进了内核"，这一 job 验下一段：包真的被交到
  # 用户态、跑完检测链、判决真的被内核执行，以及 stop() 之后主机恢复可达。
  live-nfqueue:
    name: Live NFQUEUE e2e (Linux, netns)
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libnetfilter-queue-dev iputils-ping procps
          # venv 放 /tmp 而不是复用 job 自带的解释器：套件在命名空间里以 root
          # 跑，HOME 变成 /root 之后落在 runner 用户家目录的包就看不见了。
          python -m venv /tmp/nips-nf-venv
          /tmp/nips-nf-venv/bin/pip install -q numpy pyyaml
          # NetfilterQueue 只有 sdist。--no-build-isolation 让它的 setup.py 看得
          # 见上面装的 Cython，于是重新生成 .pyx 而不是编译 tarball 里那份旧 .c。
          /tmp/nips-nf-venv/bin/pip install -q setuptools wheel cython
          /tmp/nips-nf-venv/bin/pip install -q --no-build-isolation NetfilterQueue

      - name: Confirm the binding imports
        run: >
          /tmp/nips-nf-venv/bin/python -c "import netfilterqueue as n;
          print('netfilterqueue', n.VERSION, [m for m in ('NetfilterQueue','Packet')
          if hasattr(n, m)])"

      - name: Build namespace pair
        run: sudo bash scripts/live_nfqueue_topology.sh up

      - name: Run live checks
        run: |
          set -o pipefail
          sudo ip netns exec nips-srv /tmp/nips-nf-venv/bin/python \
            scripts/verify_live_nfqueue.py 2>&1 | tee live.log
          grep -q "LIVE NFQUEUE E2E: PASS" live.log

      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-nfqueue
          path: live.log
          retention-days: 14

      - name: Remove namespace pair
        if: always()
        run: sudo bash scripts/live_nfqueue_topology.sh down || true

  # ── 容器部署闭环 ───────────────────────────────────────────────────
  # deploy.sh 的 build/start/health/test 必须在 CI 里真跑：镜像构建、容器起
  # 服务、容器内测试套件，这三件事不验就只是纸面假设。
  docker:
    name: Docker deploy loop
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: bash deploy.sh build

      - name: Start and wait for the API
        run: |
          bash deploy.sh start
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then ready=yes; break; fi
            sleep 2
          done
          test -n "$ready" || { docker compose logs api; exit 1; }

      - name: Health endpoint
        run: bash deploy.sh health

      - name: Verification suite inside the container
        run: |
          set -o pipefail
          bash deploy.sh test 2>&1 | tee container-tests.log
          # 命令本身不存在时同样会"全绿"（python3.13 那次就是这么骗过去的）。
          grep -qi "command not found" container-tests.log && {
            echo "::error::容器内有条测试命令根本没跑起来"; exit 1; }
          if grep -q '\[SKIP\]' container-tests.log; then
            {
              echo "### 容器内跳过项"
              grep '\[SKIP\]' container-tests.log | sed 's/^/`/'
              echo "（Parquet 引擎是开发依赖，运行时镜像按设计不装）"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Missing rules.json is created, not an IsADirectoryError
        run: |
          bash deploy.sh stop
          rm -f rules.json
          bash deploy.sh start
          sleep 3
          test -f rules.json
          curl -fsS http://127.0.0.1:8000/health

      - name: Container is the management plane only
        run: |
          # 容器没有 NET_ADMIN：它装不了内核规则。哪天真能装了，README 的说法
          # 就是错的——所以这里失败要失败得响亮。
          if docker compose exec api iptables -S 2>/dev/null | grep -q '^-N NIPS'; then
            echo "::error::无特权的 API 容器创建了防火墙链"
            exit 1
          fi
          echo "confirmed: container holds no netfilter privileges"

      - name: Upload the container suite log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-suite
          path: container-tests.log
          retention-days: 14

      - name: Tear down
        if: always()
        run: bash deploy.sh stop || true

  # ── systemd 单元 ───────────────────────────────────────────────────
  # 单元文件只做 INI 解析是不够的：它会被 systemd 真正启动，所以在这里
  # verify + 起停。拦截器经 NetworkNamespacePath drop-in 放进独立 netns，
  # 否则会往 runner 自己的 INPUT 上挂 NFQUEUE。
  systemd:
    name: systemd units (verify + API service)
    needs: [triage, preflight]
    if: needs.triage.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the package into /opt/nips
        run: |
          sudo mkdir -p /opt/nips
          sudo cp -a . /opt/nips/
          sudo python3 -m venv /opt/nips/venv
          sudo /opt/nips/venv/bin/pip install -q -r /opt/nips/requirements-dev.txt
          sudo useradd --create-home --shell /bin/bash nips
          sudo chown -R nips:nips /opt/nips

      - name: Install units and verify them
        run: |
          sudo cp deploy/systemd/*.service /etc/systemd/system/
          sudo systemctl daemon-reload
          # 未知指令、坏路径都会在这里失败——单元文件 otherwise 只会静默腐烂。
          sudo systemd-analyze verify nips-api.service nips-interceptor.service

      - name: API unit starts, serves and stops
        run: |
          sudo systemctl enable --now nips-api
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/status >/dev/null
          sudo systemctl is-active --quiet nips-api
          sudo systemctl stop nips-api
          sudo systemctl reset-failed nips-api || true

      - name: The API unit installs no firewall rules
        run: |
          # 权限分离是设计主张：只有拦截器单元可以碰 netfilter，API 单元不带
          # NET_ADMIN。只跑 API 单元就冒出 NIPS 链，说明这个分离是假的。
          sleep 2
          if iptables -S 2>/dev/null | grep -q '^-N NIPS'; then
            echo "::error::无特权的 API 单元创建了防火墙链"
            exit 1
          fi
          echo "confirmed: API unit alone installs no netfilter rules"

      # The interceptor unit is verified for syntax and hardening directives
      # above.  Its old "we cannot start it here" excuse no longer holds — the
      # live-nfqueue job in this very workflow builds the netfilterqueue binding
      # on CPython 3.12 with cython + --no-build-isolation — so starting it,
      # confirming it installs the chain, and confirming teardown leaves no
      # trace is a follow-up PR, not a platform limitation.

  # ── 聚合：分支保护唯一需要钉的名字 ────────────────────────────────
  # skipped 算通过（文档类 PR 的重 job 本就该被跳过），failure / cancelled /
  # timed_out 算失败。没有自动重试：那只会把 flaky 变成假绿。
  required:
    name: ci/required
    if: always()
    needs:
      - triage
      - workflow-lint
      - preflight
      - unit
      - units-inline
      - kernel-rules
      - live-nfqueue
      - docker
      - systemd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          acceptable = {"success", "skipped"}
          rows, bad = [], []
          for job in sorted(needs):
              result = needs[job]["result"]
              rows.append(f"| `{job}` | {result} |")
              if result not in acceptable:
                  bad.append(f"{job}={result}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### 门禁结论\n\n| job | result |\n|---|---|\n"
                           + "\n".join(rows) + "\n")
          if bad:
              print(f"::error::门禁未通过: {', '.join(bad)}")
              sys.exit(1)
          print("所有 job 通过或被合法跳过")
          PY
