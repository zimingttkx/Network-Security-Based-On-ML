name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 静态分析 & 代码规范 ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff

      - name: Ruff — syntax & basic errors
        run: |
          ruff check networksecurity/ app.py cli.py scripts/ \
            --select=E9,F63,F7,F82 \
            --output-format=full
          echo "Syntax/error check passed"

      - name: Ruff — code style
        run: |
          ruff check networksecurity/ app.py cli.py \
            --select=F,E,W,I,N,UP,B,SIM,PL,RET,PERF \
            --ignore=E501,S101,S311,S104,DTZ005,BLE001,RUF012,RUF013,EXE001,F841,W293,W291,PLR2004,N803,PLC0415,E741,N806,B904,PLR0913,PLR0917,PLW0603,RET504,PERF203,PERF401,SIM105 \
            --exit-zero \
            --statistics
          echo "Style check passed (warnings only, non-blocking)"

  # ── 安全扫描 ─────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Bandit — security scan
        run: |
          bandit -r networksecurity/ app.py cli.py \
            --skip B101,B303,B311,B104,B310 \
            -f screen \
            -ll
          echo "Security scan completed"

  # ── 关键字扫描 ───────────────────────────────────────────────────────
  keyword-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect simulation code in production modules
        run: |
          echo "Scanning networksecurity/ for forbidden keywords..."
          
          # Check directory exists
          if [ ! -d "networksecurity" ]; then
            echo "::error::networksecurity/ directory not found"
            exit 1
          fi
          
          # Count Python files to ensure we're scanning something
          FILE_COUNT=$(find networksecurity/ -name "*.py" -type f 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::No Python files found in networksecurity/"
            exit 1
          fi
          echo "Found $FILE_COUNT Python files to scan"
          
          FORBIDDEN="mock simulate fake demo_data generate_packet test_traffic"
          VIOLATIONS=0
          for kw in $FORBIDDEN; do
            HITS=$(grep -rn "$kw" networksecurity/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
            if [ -n "$HITS" ]; then
              echo "::error::Forbidden keyword '$kw' found in production code:"
              echo "$HITS"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::error::$VIOLATIONS simulation keywords found. Remove before merging."
            exit 1
          fi
          echo "No forbidden keywords found."

  # ── 模块导入 & 基本功能测试 ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install numpy fastapi uvicorn httpx scikit-learn pandas pyyaml pyarrow
          pip install -e . --no-deps 2>/dev/null || true

      - name: Import check — all modules
        run: |
          python -c "
          import networksecurity
          import networksecurity.engine
          import networksecurity.engine.detector
          import networksecurity.engine.verdict
          import networksecurity.engine.rule_engine
          import networksecurity.engine.pipeline
          import networksecurity.engine.kitsune
          import networksecurity.engine.lucid
          import networksecurity.features
          import networksecurity.interception
          import networksecurity.data
          import networksecurity.observability
          print('All modules import OK')
          "

      - name: Unit test — pipeline lifecycle
        run: |
          python -c "
          import asyncio
          from networksecurity.engine import DetectionPipeline, PacketInfo, Action
          from networksecurity.engine.kitsune.detector_adapter import KitsuneDetector

          async def test():
              p = DetectionPipeline()
              p.add_detector(KitsuneDetector())

              # lifecycle
              assert p.running == False
              p.start()
              assert p.running == True

              # blacklist
              p.rule_engine.add_blacklist('10.0.0.99')
              v = await p.process_packet(PacketInfo(
                  '10.0.0.99', '192.168.1.1', 1234, 80, 6, 100, 0.0))
              assert v.action == Action.BLOCK

              # whitelist
              p.rule_engine.add_whitelist('10.0.0.50')
              v2 = await p.process_packet(PacketInfo(
                  '10.0.0.50', '192.168.1.1', 1234, 80, 6, 100, 0.0))
              assert v2.action == Action.ALLOW

              # protocol filter
              v3 = await p.process_packet(PacketInfo(
                  '192.168.1.5', '192.168.1.1', 0, 0, 1, 64, 0.0))
              assert v3.action == Action.BLOCK

              # counters
              assert p.total_processed == 3
              assert p.total_blocked == 2

              p.stop()
              assert p.running == False
              print(f'Pipeline test OK: {p.total_processed}pkt/{p.total_blocked}blocked')

          asyncio.run(test())
          "

      - name: Unit test — packet parser (TTL + TCP options)
        run: |
          python -c "
          import struct, socket
          from networksecurity.interception.packet_parser import PacketParser

          def ip_header(total_len):
              ip = bytearray(20)
              ip[0] = 0x45; struct.pack_into('!H', ip, 2, total_len)
              ip[8] = 128; ip[9] = 6  # TTL=128, TCP
              ip[12:16] = socket.inet_aton('10.0.0.1')
              ip[16:20] = socket.inet_aton('10.0.0.2')
              return bytes(ip)

          tcp = bytearray(20)
          tcp[12] = 0x50  # data offset = 5
          struct.pack_into('!H', tcp, 0, 12345)
          struct.pack_into('!H', tcp, 2, 80)
          tcp[13] = 0x02
          pkt = PacketParser.from_raw(ip_header(40) + bytes(tcp))
          assert pkt and pkt.ttl == 128 and pkt.src_port == 12345
          print(f'Parser test OK: TTL={pkt.ttl} sport={pkt.src_port}')

          # TCP with options: total_len has to cover the longer header, or the
          # frame contradicts itself and the fail-closed parser rejects it.
          tcp2 = bytearray(32)
          tcp2[12] = 0x80  # data offset = 8 (32 bytes)
          struct.pack_into('!H', tcp2, 0, 54321)
          struct.pack_into('!H', tcp2, 2, 443)
          tcp2[13] = 0x18
          pkt2 = PacketParser.from_raw(ip_header(52) + bytes(tcp2))
          assert pkt2 and pkt2.src_port == 54321 and pkt2.tcp_flags == 0x18
          assert pkt2.payload_size == 0 and pkt2.packet_size == 52
          print(f'TCP options OK: sport={pkt2.src_port} flags={pkt2.tcp_flags:#x}')

          # The same frame with a lying total_len must be rejected outright.
          assert PacketParser.from_raw(ip_header(40) + bytes(tcp2)) is None
          print('Inconsistent total_len rejected OK')
          "

      - name: Unit test — RuleEngine persistence
        run: |
          python -c "
          import tempfile, os, json
          from pathlib import Path
          from networksecurity.engine.rule_engine import RuleEngine

          re = RuleEngine()
          re.add_blacklist('10.0.0.1')
          re.add_whitelist('192.168.1.0/24')

          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
              tmp = f.name
          re.save_rules(Path(tmp))

          re2 = RuleEngine()
          re2.load_rules(Path(tmp))
          os.unlink(tmp)

          assert '10.0.0.1' in re2.get_blacklist()
          assert '192.168.1.0/24' in re2.get_whitelist()
          print('Persistence test OK')
          "

      - name: Regression — post-training FPR guard (wall-clock incident)
        run: |
          python scripts/verify_fpr_regression.py

      - name: Unit test — engine module (78 checks)
        run: |
          python scripts/verify_engine_module.py

      - name: Unit test — interception module (42 checks)
        run: |
          python scripts/verify_interception_module.py

      - name: Unit test — block lifecycle (6 bugs verified)
        run: |
          python scripts/verify_block_lifecycle.py

      - name: Unit test — live exposed bugs (C/G groups)
        run: |
          python scripts/verify_live_exposed_bugs.py

      - name: Unit test — features module (bounded memory)
        run: |
          python scripts/verify_features_module.py

      - name: Unit test — data module (one-hot alignment)
        run: |
          python scripts/verify_data_module.py

      - name: Unit test — management plane (app.py + cli.py, 55 checks)
        run: |
          python scripts/verify_management_plane.py

  # ── 攻击仿真冒烟测试 ─────────────────────────────────────────────────
  smoke-attack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scikit-learn pandas

      - name: Attack simulation — quick smoke
        run: |
          python -c "
          import asyncio, sys
          sys.path.insert(0, '.')
          from networksecurity.engine import DetectionPipeline, PacketInfo, Action
          from networksecurity.engine.kitsune.detector_adapter import KitsuneDetector
          import random

          NORMAL_IPS = [f'192.168.{i}.{j}' for i in range(1,5) for j in range(1,20)]
          ATTACK_IPS = [f'45.33.{i}.{j}' for i in range(32,36) for j in range(1,50)]

          async def quick_test():
              p = DetectionPipeline()
              k = KitsuneDetector()
              k.set_grace_periods(fm_grace_period=500, ad_grace_period=1000)
              p.add_detector(k)

              # feed normal traffic
              for i in range(2000):
                  src = random.choice(NORMAL_IPS)
                  pkt = PacketInfo(src, '10.0.0.1',
                      random.randint(32768,65535), random.choice([80,443,22]),
                      6, random.randint(40,1500), i*0.001,
                      tcp_flags=random.choice([0x02,0x10,0x18]))
                  await p.process_packet(pkt)

              # feed attack traffic
              detected = 0
              for i in range(500):
                  src = random.choice(ATTACK_IPS)
                  pkt = PacketInfo(src, '10.0.0.1',
                      random.randint(1,65535), 80, 6, 40, 2000.0 + i*0.0001,
                      tcp_flags=0x02)
                  v = await p.process_packet(pkt)
                  if v.action == Action.BLOCK:
                      detected += 1

              dr = detected / 500 * 100
              print(f'Attack smoke test: {detected}/500 detected ({dr:.0f}%)')
              assert dr >= 50, f'Detection rate too low: {dr:.0f}%'
              print('Smoke test passed')

          asyncio.run(quick_test())
          "

  # ── 内核规则实测（Linux）─────────────────────────────────────────────
  # 其余测试验证的是我们自己的记账；这一 job 验证真正决定丢包的
  # 东西——内核里的规则集。用独立 netns 运行：netfilter 规则是
  # 按 netns 隔离的，runner 自身的网络不受影响，也不会污染宿主。
  kernel-rules:
    name: Kernel rules (Linux, netns)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pyyaml

      - name: Create isolated network namespace
        run: sudo ip netns add nips-verify

      - name: Verify real iptables behaviour
        run: sudo ip netns exec nips-verify python scripts/verify_kernel_rules.py

      - name: Remove namespace
        if: always()
        run: sudo ip netns del nips-verify || true
