# NIPS — Network Intrusion Prevention System
# API server (management interface). The interceptor runs directly on the host
# for NFQUEUE access and iptables management.

services:
  api:
    build: .
    image: network-security-ml:latest
    container_name: nips-api
    restart: unless-stopped
    ports:
      # Bind to loopback only: the management API can blacklist/whitelist
      # arbitrary IPs and control the engine.  Remote access should go
      # through an authenticated reverse proxy, not a published port.
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      # Example: set via docker run -e NIPS_API_TOKEN=your_secret_token
      # - NIPS_API_TOKEN=${NIPS_API_TOKEN}
    volumes:
      - ./rules.json:/app/rules.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
