# NIPS — Network Intrusion Prevention System
# API server (management interface). The interceptor runs directly on the host
# for NFQUEUE access and iptables management.

services:
  api:
    build: .
    container_name: nips-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      - ./rules.json:/app/rules.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
